<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Portfolio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%232a78d6%27/%3E%3Cpath d=%27M3 11.5l3.2-3.6 2.4 2.1L13 4.5%27 fill=%27none%27 stroke=%27white%27 stroke-width=%271.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------------------
   Tokens. Roles, not raw hex, are used throughout the body, so light/dark swap
   in one place. Dark values are declared under both the OS media query and the
   data-theme scope so a manual toggle wins either way.
   Categorical slots 1-3 (blue/orange/aqua) carry the watcher tags: that triple
   passes the all-pairs CVD, normal-vision and contrast checks in both modes.
   Every tag also carries a text label, so identity is never colour-alone.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --plane:          #f9f9f7;
  --surface:        #fcfcfb;
  --surface-alt:    #f3f2ee;
  --ink:            #0b0b0b;
  --ink-2:          #52514e;
  --ink-muted:      #898781;
  --rule:           #e1e0d9;
  --rule-strong:    #c3c2b7;
  --ring:           rgba(11,11,11,0.10);

  --up:             #006300;   /* delta up (success text) */
  --down:           #d03b3b;   /* status critical, used as delta-down text */
  --bar:            #d03b3b;

  --cat-tessa:      #2a78d6;   /* categorical slot 1 */
  --cat-graeme:     #eb6834;   /* categorical slot 2 */
  --cat-both:       #1baf7a;   /* categorical slot 3 */
  --wash-tessa:     rgba(42,120,214,0.09);
  --wash-graeme:    rgba(235,104,52,0.10);
  --wash-both:      rgba(27,175,122,0.11);

  --warn:           #b26a00;
  --warn-bg:        rgba(250,178,25,0.16);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane:        #0d0d0d;
    --surface:      #1a1a19;
    --surface-alt:  #232321;
    --ink:          #ffffff;
    --ink-2:        #c3c2b7;
    --ink-muted:    #898781;
    --rule:         #2c2c2a;
    --rule-strong:  #383835;
    --ring:         rgba(255,255,255,0.10);

    --up:           #0ca30c;
    --down:         #e66767;
    --bar:          #d03b3b;

    --cat-tessa:    #3987e5;
    --cat-graeme:   #d95926;
    --cat-both:     #199e70;
    --wash-tessa:   rgba(57,135,229,0.16);
    --wash-graeme:  rgba(217,89,38,0.16);
    --wash-both:    rgba(25,158,112,0.18);

    --warn:         #fab219;
    --warn-bg:      rgba(250,178,25,0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --surface-alt: #232321;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
  --rule: #2c2c2a; --rule-strong: #383835; --ring: rgba(255,255,255,0.10);
  --up: #0ca30c; --down: #e66767; --bar: #d03b3b;
  --cat-tessa: #3987e5; --cat-graeme: #d95926; --cat-both: #199e70;
  --wash-tessa: rgba(57,135,229,0.16); --wash-graeme: rgba(217,89,38,0.16);
  --wash-both: rgba(25,158,112,0.18);
  --warn: #fab219; --warn-bg: rgba(250,178,25,0.14);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--plane);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 1480px; margin: 0 auto; padding: 20px 16px 64px; }

/* ----- header ----------------------------------------------------------- */
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 4px; }
h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
.updated {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--ring);
  border-radius: 999px; padding: 4px 11px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--up); flex: none; }
.dot.warn { background: var(--warn); }
.dot.err  { background: var(--down); }
.sub { font-size: 13px; color: var(--ink-muted); margin: 6px 0 18px; }

/* ----- stat cards ------------------------------------------------------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.card {
  background: var(--surface); border: 1px solid var(--ring);
  border-radius: 12px; padding: 13px 15px 14px; min-width: 0;
}
.card .label {
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--ink-muted); margin-bottom: 7px;
}
/* Proportional figures on stat values; tabular-nums is for the table only. */
.card .value { font-size: 25px; font-weight: 640; letter-spacing: -0.02em; line-height: 1.1; }
.card .meta { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.card .meta strong { color: var(--ink); font-weight: 620; }

/* ----- legend ----------------------------------------------------------- */
.legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  background: var(--surface); border: 1px solid var(--ring);
  border-radius: 10px; padding: 9px 13px; margin-bottom: 14px; font-size: 13px;
}
.legend .who { font-weight: 600; color: var(--ink-2); margin-right: 2px; }
.legend-item { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
.swatch { width: 22px; height: 13px; border-radius: 4px; border: 1px solid var(--ring); flex: none; }
.swatch.tessa  { background: var(--wash-tessa);  border-color: var(--cat-tessa); }
.swatch.graeme { background: var(--wash-graeme); border-color: var(--cat-graeme); }
.swatch.both   { background: var(--wash-both);   border-color: var(--cat-both); }

/* ----- table ------------------------------------------------------------ */
.tablecard {
  background: var(--surface); border: 1px solid var(--ring);
  border-radius: 12px; overflow: hidden;
}
.scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
th {
  position: sticky; top: 0; z-index: 3;
  background: var(--surface-alt); color: var(--ink-2);
  font-size: 11.5px; font-weight: 640; letter-spacing: 0.03em; text-transform: uppercase;
  cursor: pointer; user-select: none; -webkit-user-select: none;
  border-bottom: 1px solid var(--rule-strong);
}
th:hover { color: var(--ink); }
th:focus-visible { outline: 2px solid var(--cat-tessa); outline-offset: -2px; }
th .arrow { opacity: 0; margin-left: 3px; font-size: 10px; }
th[aria-sort] .arrow { opacity: 1; }
th[aria-sort] { color: var(--ink); }
td.num, th.num { font-variant-numeric: tabular-nums; }
th.l, td.l { text-align: left; }

/* Sticky ticker column so the table stays readable while scrolled sideways. */
.c-ticker { position: sticky; left: 0; z-index: 2; background: var(--surface); }
th.c-ticker { z-index: 4; background: var(--surface-alt); }
tr.tessa  .c-ticker { background: #f1f5fc; }
tr.graeme .c-ticker { background: #fdf2ed; }
tr.both   .c-ticker { background: #eef9f4; }
:root[data-theme="dark"] tr.tessa .c-ticker,
:root[data-theme="dark"] tr.graeme .c-ticker,
:root[data-theme="dark"] tr.both .c-ticker { background: var(--surface-alt); }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) tr.tessa .c-ticker,
  :root:where(:not([data-theme="light"])) tr.graeme .c-ticker,
  :root:where(:not([data-theme="light"])) tr.both .c-ticker { background: var(--surface-alt); }
}
.c-ticker::after {
  content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 1px; background: var(--rule);
}

tbody tr.tessa  { background: var(--wash-tessa); }
tbody tr.graeme { background: var(--wash-graeme); }
tbody tr.both   { background: var(--wash-both); }
tbody tr:hover td { background: var(--surface-alt); }
tbody tr:hover .c-ticker { background: var(--surface-alt); }

.tk { font-weight: 640; letter-spacing: -0.01em; }
.tag {
  display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 5px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
  color: #fff; vertical-align: 1px;
}
.tag.tessa  { background: var(--cat-tessa); }
.tag.graeme { background: var(--cat-graeme); }
.tag.both   { background: var(--cat-both); }

.up   { color: var(--up); }
.down { color: var(--down); }
.na   { color: var(--ink-muted); }
.sym  { font-size: 10px; }        /* the ▲/▼ that keeps gain/loss off colour alone */

.name { color: var(--ink-2); max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
.sub2 { display: block; font-size: 11px; color: var(--ink-muted); font-weight: 400; }
.onlynarrow { display: none; }

/* Drawdown: a thin bar anchored right (at-peak) growing left, plus the number. */
.dd { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.ddbar { display: flex; justify-content: flex-end; width: 54px; height: 7px;
         background: var(--rule); border-radius: 4px; overflow: hidden; flex: none; }
.ddfill { display: block; height: 100%; min-width: 2px; background: var(--bar); border-radius: 4px; }

.notes { text-align: left; white-space: normal; min-width: 210px; max-width: 250px;
         font-size: 11.5px; color: var(--ink-2); line-height: 1.35; }
.flag { color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 0 4px; font-weight: 600; }
.stalepill { color: var(--down); font-weight: 600; }
.glyph { display: inline-block; margin-left: 6px; width: 14px; height: 14px; line-height: 14px;
         text-align: center; border-radius: 4px; font-size: 10px; font-weight: 800;
         background: var(--warn-bg); color: var(--warn); vertical-align: 1px; cursor: help; }

tfoot td { border-top: 2px solid var(--rule-strong); border-bottom: none;
           font-weight: 660; background: var(--surface-alt); position: sticky; bottom: 0; }
tfoot td.c-ticker { background: var(--surface-alt); }

/* Refetch: hold the previous render at reduced opacity. Never a skeleton flash. */
.refreshing .tablecard, .refreshing .stats { opacity: 0.55; transition: opacity 120ms ease; }
.tablecard, .stats { transition: opacity 180ms ease; }

.err {
  background: var(--warn-bg); border: 1px solid var(--warn); color: var(--ink);
  border-radius: 10px; padding: 10px 13px; margin-bottom: 14px; font-size: 13.5px;
}
footer { margin-top: 16px; font-size: 12px; color: var(--ink-muted); }
footer button {
  font: inherit; font-size: 12px; color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--ring); border-radius: 7px; padding: 4px 10px; cursor: pointer;
}

@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .card .value { font-size: 22px; }
}
@media (max-width: 560px) {
  .wrap { padding: 14px 10px 48px; }
  h1 { font-size: 18px; }
  table { font-size: 12.5px; }
  th, td { padding: 7px 8px; }
  .notes { min-width: 150px; max-width: 180px; }
  th.c-name, td.c-name { display: none; }
  .onlynarrow { display: block; max-width: 116px; overflow: hidden; text-overflow: ellipsis; }
  .ddbar { width: 34px; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Portfolio</h1>
    <span class="updated" id="updated"><span class="dot" id="dot"></span><span id="updatedText">Loading…</span></span>
  </header>
  <p class="sub" id="subline">42 holdings · prices from Yahoo Finance via yfinance</p>

  <div id="banner"></div>

  <section class="stats" id="stats" aria-label="Portfolio summary"></section>

  <div class="legend">
    <span class="who">Watching:</span>
    <span class="legend-item"><span class="swatch tessa"></span>Tessa</span>
    <span class="legend-item"><span class="swatch graeme"></span>Graeme</span>
    <span class="legend-item"><span class="swatch both"></span>Both</span>
    <span class="legend-item na">Unshaded rows are not on either watchlist.</span>
  </div>

  <div class="tablecard">
    <div class="scroller">
      <table id="tbl">
        <thead><tr id="hrow"></tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>
  </div>

  <footer>
    <p id="foot"></p>
    <button id="themeBtn" type="button">Toggle light / dark</button>
  </footer>
</div>

<script>
"use strict";

/* Columns: key drives sorting; render draws the cell. `na` marks a row whose
   value in this column is missing, so it can be forced to the bottom. */
const REFRESH_MS = 60000;

const fmtUsd = n => "$" + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtNzd = n => "NZ$" + n.toLocaleString("en-NZ", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtBig = (n, cur) => (cur === "NZD" ? "NZ$" : "$") +
  n.toLocaleString(cur === "NZD" ? "en-NZ" : "en-US", {maximumFractionDigits: 0});

function pctCell(v) {
  if (v === null || v === undefined) return '<span class="na">N/A</span>';
  const cls = v > 0 ? "up" : (v < 0 ? "down" : "");
  const sym = v > 0 ? "▲" : (v < 0 ? "▼" : "");
  return `<span class="${cls}"><span class="sym">${sym}</span> ${v > 0 ? "+" : ""}${v.toFixed(1)}%</span>`;
}

let DATA = null;
let sortKey = "drawdown_pct";
let sortDir = 1;               /* 1 = ascending; drawdown ascending = worst first */

const valueUsd = p => (p.price == null ? null : p.price * p.shares);
const valueNzd = p => {
  const u = valueUsd(p), fx = DATA && DATA.fx && DATA.fx.usd_nzd;
  return (u == null || !fx) ? null : u * fx;
};

const COLUMNS = [
  {key: "ticker", label: "Ticker", cls: "l c-ticker", get: p => p.ticker,
   render: p => `<span class="tk">${esc(p.ticker)}</span>` +
     (p.watcher ? `<span class="tag ${p.watcher.toLowerCase()}">${p.watcher}</span>` : "") +
     flagGlyph(p) +
     `<span class="sub2 onlynarrow">${esc(p.name || "")}</span>`},
  {key: "name", label: "Company", cls: "l c-name", get: p => p.name || "",
   render: p => `<div class="name" title="${esc(p.name || "")}">${esc(p.name || "—")}</div>`},
  {key: "shares", label: "Shares", cls: "num", get: p => p.shares,
   render: p => p.shares.toLocaleString("en-US", {maximumFractionDigits: 4})},
  {key: "price", label: "Price", cls: "num", get: p => p.price,
   render: p => p.price == null ? '<span class="na">N/A</span>'
     : `${fmtUsd(p.price)}<span class="sub2">${priceAsOf(p)}</span>`},
  {key: "chg_1d", label: "1D", cls: "num", get: p => p.chg_1d, render: p => pctCell(p.chg_1d)},
  {key: "chg_1w", label: "1W", cls: "num", get: p => p.chg_1w, render: p => pctCell(p.chg_1w)},
  {key: "chg_1m", label: "1M", cls: "num", get: p => p.chg_1m, render: p => pctCell(p.chg_1m)},
  {key: "chg_3m", label: "3M", cls: "num", get: p => p.chg_3m, render: p => pctCell(p.chg_3m)},
  {key: "chg_6m", label: "6M", cls: "num", get: p => p.chg_6m,
   render: p => p.chg_6m != null ? pctCell(p.chg_6m)
     : (p.chg_since_ipo != null
        ? `<span class="na">N/A</span><span class="sub2">${p.chg_since_ipo > 0 ? "+" : ""}${p.chg_since_ipo.toFixed(1)}% since listing</span>`
        : '<span class="na">N/A</span>')},
  {key: "peak_6m", label: "6M peak", cls: "num", get: p => p.peak_6m,
   render: p => p.peak_6m == null ? '<span class="na">N/A</span>'
     : `${fmtUsd(p.peak_6m)}<span class="sub2">${esc(p.peak_6m_date || "")}</span>`},
  {key: "drawdown_pct", label: "Drawdown", cls: "num", get: p => p.drawdown_pct,
   render: p => {
     if (p.drawdown_pct == null) return '<span class="na">N/A</span>';
     const mag = Math.min(Math.abs(p.drawdown_pct), 60) / 60 * 100;
     const fill = Math.abs(p.drawdown_pct) > 0.05
       ? `<span class="ddfill" style="width:${mag.toFixed(1)}%"></span>` : "";
     return `<div class="dd"><span class="ddbar">${fill}</span>` +
            `<span class="${p.drawdown_pct < 0 ? "down" : ""}">${p.drawdown_pct.toFixed(1)}%</span></div>`;
   }},
  {key: "value_usd", label: "Value USD", cls: "num", get: valueUsd,
   render: p => { const v = valueUsd(p); return v == null ? '<span class="na">N/A</span>' : fmtUsd(v); }},
  {key: "value_nzd", label: "Value NZD", cls: "num", get: valueNzd,
   render: p => { const v = valueNzd(p); return v == null ? '<span class="na">N/A</span>' : fmtNzd(v); }},
  {key: "notes", label: "Notes", cls: "l", get: p => (p.notes || []).length,
   render: p => renderNotes(p)},
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

function priceAsOf(p) {
  if (p.price_source === "intraday") return "live";
  return p.last_close_date ? "close " + esc(p.last_close_date) : "close";
}

/* True for notes that want the reader's eye: a stale carry-forward, a value
   that could not be derived, or a corporate action needing verification. */
const isFlag = n => /^(Stale:|VERIFY:)/.test(n) || /stale quote/i.test(n) || /^No .*data/.test(n);

function flagGlyph(p) {
  const hits = (p.notes || []).filter(isFlag);
  if (!hits.length) return "";
  return `<span class="glyph" role="img" aria-label="Flagged: ${esc(hits.join(". "))}"` +
         ` title="${esc(hits.join("\n"))}">!</span>`;
}

function renderNotes(p) {
  const notes = p.notes || [];
  if (!notes.length) return "";
  return '<div class="notes">' + notes.map(n => {
    if (/^Stale:/.test(n)) return `<span class="stalepill">${esc(n)}</span>`;
    if (/^VERIFY:/.test(n) || /stale quote/i.test(n)) return `<span class="flag">${esc(n)}</span>`;
    return esc(n);
  }).join("<br>") + "</div>";
}

/* Sorting. Missing values always land at the bottom, whichever direction is
   active, so N/A rows never clutter the top of a sorted list. */
function sortRows(rows) {
  const col = COLUMNS.find(c => c.key === sortKey) || COLUMNS[0];
  return rows.slice().sort((a, b) => {
    const av = col.get(a), bv = col.get(b);
    const an = av === null || av === undefined || av === "";
    const bn = bv === null || bv === undefined || bv === "";
    if (an && bn) return String(a.ticker).localeCompare(String(b.ticker));
    if (an) return 1;
    if (bn) return -1;
    if (typeof av === "string" || typeof bv === "string") {
      return String(av).localeCompare(String(bv)) * sortDir;
    }
    if (av === bv) return String(a.ticker).localeCompare(String(b.ticker));
    return (av - bv) * sortDir;
  });
}

function renderHead() {
  document.getElementById("hrow").innerHTML = COLUMNS.map(c => {
    const active = c.key === sortKey;
    const arrow = active ? (sortDir === 1 ? "▲" : "▼") : "▲";
    return `<th class="${c.cls}" data-key="${c.key}" tabindex="0" role="columnheader" scope="col"` +
           (active ? ` aria-sort="${sortDir === 1 ? "ascending" : "descending"}"` : "") +
           `>${c.label}<span class="arrow">${arrow}</span></th>`;
  }).join("");
  document.querySelectorAll("#hrow th").forEach(th => {
    const go = () => {
      const k = th.dataset.key;
      if (k === sortKey) { sortDir = -sortDir; }
      else { sortKey = k; sortDir = (k === "drawdown_pct" || k === "ticker" || k === "name") ? 1 : -1; }
      render();
    };
    th.addEventListener("click", go);
    th.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
    });
  });
}

function render() {
  if (!DATA) return;
  renderHead();
  const rows = sortRows(DATA.positions || []);

  document.getElementById("tbody").innerHTML = rows.map(p => {
    const cls = p.watcher ? p.watcher.toLowerCase() : "";
    return `<tr class="${cls}">` +
      COLUMNS.map(c => `<td class="${c.cls}">${c.render(p)}</td>`).join("") + "</tr>";
  }).join("");

  /* Totals. Only priced rows contribute; anything excluded is called out. */
  const priced = rows.filter(p => valueUsd(p) != null);
  const totUsd = priced.reduce((s, p) => s + valueUsd(p), 0);
  const fx = DATA.fx && DATA.fx.usd_nzd;
  const missing = rows.length - priced.length;
  /* The footer must carry the same per-column classes as the header, or a
     column hidden at narrow widths shifts every total one cell across. The
     spacer span is derived from COLUMNS so adding a column cannot desync it. */
  const spacer = COLUMNS.length - 5;          // all but ticker, name, usd, nzd, notes
  document.getElementById("tfoot").innerHTML =
    `<tr><td class="l c-ticker">Total</td>` +
    `<td class="l c-name">${priced.length} of ${rows.length} priced` +
      (missing ? ` <span class="stalepill">· ${missing} excluded</span>` : "") + `</td>` +
    `<td colspan="${spacer}"></td>` +
    `<td class="num">${fmtUsd(totUsd)}</td>` +
    `<td class="num">${fx ? fmtNzd(totUsd * fx) : '<span class="na">N/A</span>'}</td>` +
    `<td></td></tr>`;

  renderStats(rows, totUsd, fx);
}

function best(rows, key, dir) {
  const ok = rows.filter(p => p[key] != null);
  if (!ok.length) return null;
  return ok.reduce((a, b) => (dir * (b[key] - a[key]) > 0 ? b : a));
}

function renderStats(rows, totUsd, fx) {
  const worst = best(rows, "drawdown_pct", -1);
  const mover = best(rows, "chg_1d", 1);
  const half = best(rows, "chg_6m", 1);
  const card = (label, value, meta) =>
    `<div class="card"><div class="label">${label}</div><div class="value">${value}</div>` +
    `<div class="meta">${meta}</div></div>`;

  const signed = v => `${v > 0 ? "+" : ""}${v.toFixed(1)}%`;
  document.getElementById("stats").innerHTML = [
    card("Total value", fmtBig(totUsd, "USD"),
         fx ? `${fmtBig(totUsd * fx, "NZD")} at 1 USD = ${fx.toFixed(4)} NZD` +
              (DATA.fx.stale ? ' <span class="flag">FX stale</span>' : "")
            : '<span class="flag">FX unavailable</span>'),
    card("Largest drawdown", worst ? `<span class="down">${worst.drawdown_pct.toFixed(1)}%</span>` : "N/A",
         worst ? `<strong>${esc(worst.ticker)}</strong> from its 6M peak of ${fmtUsd(worst.peak_6m)}` : "no data"),
    card("Best 1-day mover",
         mover ? `<span class="${mover.chg_1d >= 0 ? "up" : "down"}">${signed(mover.chg_1d)}</span>` : "N/A",
         mover ? `<strong>${esc(mover.ticker)}</strong> ${esc(mover.name || "")}` : "no data"),
    card("Best 6-month",
         half ? `<span class="${half.chg_6m >= 0 ? "up" : "down"}">${signed(half.chg_6m)}</span>` : "N/A",
         half ? `<strong>${esc(half.ticker)}</strong> ${esc(half.name || "")}` : "no data"),
  ].join("");
}

function relative(iso) {
  const then = new Date(iso), mins = Math.round((Date.now() - then) / 60000);
  if (!isFinite(mins)) return iso;
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const h = Math.floor(mins / 60);
  if (h < 24) return `${h}h ${mins % 60}m ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function paintStatus() {
  if (!DATA) return;
  if (!DATA.generated_at) {              // seed file, before the first refresh
    document.getElementById("dot").className = "dot warn";
    document.getElementById("updatedText").textContent = "Awaiting first refresh";
    return;
  }
  const mins = (Date.now() - new Date(DATA.generated_at)) / 60000;
  const dot = document.getElementById("dot");
  dot.className = "dot" + (mins > 180 ? " err" : (mins > 45 ? " warn" : ""));
  const when = new Date(DATA.generated_at);
  document.getElementById("updatedText").textContent =
    `Updated ${relative(DATA.generated_at)} · ${when.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}`;
  document.getElementById("updated").title = when.toString();
}

function paintBanner() {
  const msgs = [];
  if (DATA.failures && DATA.failures.length) {
    msgs.push(`${DATA.failures.length} ticker(s) failed to refresh and are showing ` +
              `last-known-good values: <strong>${DATA.failures.map(esc).join(", ")}</strong>.`);
  }
  if (DATA.fx && DATA.fx.stale) {
    msgs.push(`FX rate is stale: ${esc(DATA.fx.note || "last known rate in use")}.`);
  }
  if (!DATA.generated_at) {
    msgs.push("No data has been fetched yet. Run <code>python3 scripts/fetch_prices.py</code>, " +
              "or wait for the scheduled refresh to run.");
  } else {
    const mins = (Date.now() - new Date(DATA.generated_at)) / 60000;
    if (mins > 180) msgs.push(`Data is over ${Math.floor(mins / 60)} hours old — the refresh job may not be running.`);
  }
  document.getElementById("banner").innerHTML =
    msgs.length ? `<div class="err">${msgs.join("<br>")}</div>` : "";
}

async function load(initial) {
  if (!initial) document.body.classList.add("refreshing");
  try {
    const res = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = await res.json();
    render();
    paintStatus();
    paintBanner();
    const f = DATA.fx || {};
    document.getElementById("subline").textContent =
      `${(DATA.positions || []).length} holdings · Yahoo Finance via yfinance` +
      (f.usd_nzd ? ` · 1 USD = ${f.usd_nzd.toFixed(4)} NZD` : "");
    document.getElementById("foot").textContent =
      `Refresh took ${DATA.duration_seconds ?? "?"}s. This page re-reads data.json every 60 seconds; ` +
      `the data itself is refreshed by the scheduled fetch job. Prices are split/dividend adjusted. ` +
      `Nothing on this page is interpolated — missing values read N/A.`;
  } catch (err) {
    document.getElementById("dot").className = "dot err";
    document.getElementById("updatedText").textContent = "Refresh failed";
    document.getElementById("banner").innerHTML =
      `<div class="err">Could not load <code>data.json</code>: ${esc(err.message)}.` +
      (DATA ? " Showing the last data this page loaded." : "") + `</div>`;
  } finally {
    document.body.classList.remove("refreshing");
  }
}

document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--plane").trim() === "#0d0d0d";
  root.setAttribute("data-theme", dark ? "light" : "dark");
});

load(true);
setInterval(() => load(false), REFRESH_MS);
setInterval(paintStatus, 30000);
</script>
</body>
</html>
