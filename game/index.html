<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lava Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      background: #fff; display: flex; justify-content: center; align-items: center;
      height: 100vh; height: 100dvh; overflow: hidden; position: relative;
    }
    canvas { background: #fff; display: block; }
    #debug {
      position: fixed; top: 0; left: 0; z-index: 999; pointer-events: none;
      font: 11px monospace; color: #888; background: rgba(255,255,255,0.85);
      padding: 4px 6px; max-height: 80px; overflow: hidden; white-space: pre-wrap;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="debug"></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resizeCanvas() {
  const vv = window.visualViewport;
  W = canvas.width = Math.round(vv ? vv.width : window.innerWidth);
  H = canvas.height = Math.round(vv ? vv.height : window.innerHeight);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);

// ─── Live config (polled from server) ────────────
const cfg = {
  lavaSpeed: 0.5,
  lavaGravity: 0.03,
  lavaSpawnRate: 80,
  lavaSizeMin: 10,
  lavaSizeMax: 50,
  lavaHarmPercent: 50,
  shipSpeed: 4,
  bulletSpeed: 8,
  shootDelay: 200,
  shipSize: 24,
  hoseCount: 2,
  restartDelay: 6,
  uiLayout: 'bottom',
  hoseStyle: 'simple', // 'simple' T-hoses or animated 'pumpers'
  allowedTargets: '10', // comma-separated list the target is picked from; empty = random 3..20
  pityEvery: 4,        // every Nth safe blob completes the sum (while one is in progress)
  bulletColors: 'black,red,orange,yellow,green,cyan,blue,purple,pink', // enabled rotation colours
  get lavaHarmSize() {
    return cfg.lavaSizeMin + (cfg.lavaHarmPercent / 100) * (cfg.lavaSizeMax - cfg.lavaSizeMin);
  },
};
let lastAllowedTargets = null;
async function pollConfig() {
  try {
    const res = await fetch('/config');
    Object.assign(cfg, await res.json());
    if (lastAllowedTargets === null) {
      lastAllowedTargets = cfg.allowedTargets;
    } else if (cfg.allowedTargets !== lastAllowedTargets) {
      lastAllowedTargets = cfg.allowedTargets;
      onAllowedTargetsChanged();
    }
  } catch(e) {}
}

// The target list changed mid-game: re-roll the target now and drop
// on-screen blobs whose numbers don't fit the new target.
function onAllowedTargetsChanged() {
  if (barState !== 'normal') return;
  randomPowerTarget();
  powerBar.bricks = 0;
  collectedValues.length = 0;
  safeSpawnsSinceHelp = 0;
  const pool = valuePool();
  for (let i = lavaParticles.length - 1; i >= 0; i--) {
    const l = lavaParticles[i];
    if (!l.harmful && !pool.includes(l.value)) lavaParticles.splice(i, 1);
  }
}
pollConfig();
setInterval(pollConfig, 1000);

// ─── Ship ────────────────────────────────────────
const ship = {
  x: W / 2,
  y: H - 60,
  get w() { return cfg.shipSize; },
  get h() { return cfg.shipSize * 1.33; },
  get speed() { return cfg.shipSpeed; },
};

// ─── Hoses ───────────────────────────────────────
const hoseY = 0;
const hoseLen = 60;

// ─── Pumper (concertina bellows) ─────────────────
const PUMPER_SCALE = 0.5;
const PUMPER_ANCHOR_Y = 20;
const PUMPER_TEETH = 6;
const PUMPER_HALFW = 62 * PUMPER_SCALE;
const PUMPER_INNER = 18 * PUMPER_SCALE;
const PUMPER_BASEGAP = 36 * PUMPER_SCALE;
const PUMPER_EXTRAGAP = 28 * PUMPER_SCALE;
const PUMPER_POINTINESS = 14 * PUMPER_SCALE;
const PUMPER_HATCH = 24;

let pumpers = []; // { ext, speed, phase, destroyed, settled } per hose

function initPumpers() {
  const n = Math.max(1, Math.round(cfg.hoseCount));
  pumpers = [];
  for (let i = 0; i < n; i++) {
    pumpers.push({ ext: 0.5, speed: 2 + Math.random(), phase: Math.random() * Math.PI * 2, destroyed: false, settled: false });
  }
}

function getPumperTipY(idx) {
  const p = pumpers[idx];
  if (!p) return PUMPER_ANCHOR_Y + 60;
  const gap = PUMPER_BASEGAP + PUMPER_EXTRAGAP * p.ext;
  return PUMPER_ANCHOR_Y + PUMPER_TEETH * gap + PUMPER_POINTINESS;
}

function updatePumpers() {
  const t = Date.now() / 1000;
  for (let i = 0; i < pumpers.length; i++) {
    const p = pumpers[i];
    if (p.settled) continue;
    if (p.destroyed) {
      p.ext *= 0.96;
      p.speed *= 0.99;
      if (p.ext < 0.01) { p.ext = 0; p.settled = true; }
    } else {
      p.ext = 0.5 + 0.5 * Math.sin(t * p.speed * 0.9 + p.phase);
    }
  }
}

function pumperJitter(seed, amp) {
  const s = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return (s - Math.floor(s) - 0.5) * 2 * amp;
}

function getPumperPoints(ax, ext) {
  const gap = PUMPER_BASEGAP + PUMPER_EXTRAGAP * ext;
  const pts = [];
  const ay = PUMPER_ANCHOR_Y;
  pts.push([ax - PUMPER_INNER, ay]);
  let y = ay;
  for (let i = 0; i < PUMPER_TEETH; i++) {
    pts.push([ax - PUMPER_HALFW, y + gap * 0.5]);
    pts.push([ax - PUMPER_INNER, y + gap]);
    y += gap;
  }
  pts.pop();
  const bottomY = y;
  pts.push([ax, bottomY + PUMPER_POINTINESS]);
  const R = [];
  y = ay;
  for (let i = 0; i < PUMPER_TEETH; i++) {
    if (i > 0) R.push([ax + PUMPER_INNER, y + gap * 0.25]);
    R.push([ax + PUMPER_HALFW, y + gap * 0.75]);
    y += gap;
  }
  R.reverse();
  for (const pt of R) pts.push(pt);
  pts.push([ax + PUMPER_INNER, ay]);
  pts.push([ax - PUMPER_INNER, ay]);
  return pts;
}

function drawPumpers() {
  const positions = getHosePositions();
  for (let idx = 0; idx < positions.length; idx++) {
    const cx = positions[idx];
    const p = pumpers[idx];
    if (!p) continue;
    const ext = p.ext;
    const gap = PUMPER_BASEGAP + PUMPER_EXTRAGAP * ext;
    const seedBase = idx * 1000;
    const jitAmp = p.settled ? 0 : p.destroyed ? Math.max(0.3, p.ext * 1.8) : 2.2;

    const destroyed = destroyedHoses.has(idx);
    const col = destroyed ? '#999' : '#111';
    const pipeCol = destroyed ? '#bbb' : '#888';

    // Pipe
    ctx.strokeStyle = pipeCol;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - PUMPER_INNER + pumperJitter(seedBase, jitAmp*0.4), 0);
    ctx.lineTo(cx - PUMPER_INNER + pumperJitter(seedBase+1, jitAmp*0.4), PUMPER_ANCHOR_Y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + PUMPER_INNER + pumperJitter(seedBase+2, jitAmp*0.4), 0);
    ctx.lineTo(cx + PUMPER_INNER + pumperJitter(seedBase+3, jitAmp*0.4), PUMPER_ANCHOR_Y);
    ctx.stroke();

    // Bellows outline
    const pts = getPumperPoints(cx, ext);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const x = pts[i][0] + pumperJitter(seedBase + i * 2, jitAmp);
      const y = pts[i][1] + pumperJitter(seedBase + i * 2 + 1, jitAmp);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();

    // Hatch lines — clipped to bellows outline
    if (!p.settled) {
      ctx.save();
      // Build clip path from bellows outline
      const clipPts = getPumperPoints(cx, ext);
      ctx.beginPath();
      for (let i = 0; i < clipPts.length; i++) {
        const x = clipPts[i][0] + pumperJitter(seedBase + i * 2, jitAmp);
        const y = clipPts[i][1] + pumperJitter(seedBase + i * 2 + 1, jitAmp);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.clip();

      const h0 = PUMPER_ANCHOR_Y + 4;
      const hSpan = (PUMPER_TEETH * gap + PUMPER_POINTINESS) - 8;
      ctx.strokeStyle = destroyed ? '#aaa' : '#111';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < PUMPER_HATCH; i++) {
        const yy = h0 + (i / PUMPER_HATCH) * hSpan;
        const wob = pumperJitter(seedBase + i * 7 + 200, jitAmp * 3);
        ctx.beginPath();
        ctx.moveTo(cx - PUMPER_HALFW - 8 + wob, yy + 8);
        ctx.lineTo(cx + PUMPER_HALFW + 8 + wob, yy - 8);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Flash on destroy
    if (destroyed) {
      const justDestroyed = Date.now() - destroyedHoses.get(idx) < 1000;
      if (justDestroyed) {
        const flash = Math.sin(frame * 0.3) > 0;
        ctx.strokeStyle = flash ? '#f84' : '#ddd';
        ctx.lineWidth = 3;
        const pts2 = getPumperPoints(cx, ext);
        ctx.beginPath();
        for (let i = 0; i < pts2.length; i++) {
          const x = pts2[i][0] + pumperJitter(seedBase + i * 2, jitAmp);
          const y = pts2[i][1] + pumperJitter(seedBase + i * 2 + 1, jitAmp);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      }
    }
  }
}

function getHosePositions() {
  const n = Math.max(1, Math.round(cfg.hoseCount));
  const positions = [];
  for (let i = 0; i < n; i++) positions.push(W * (i + 1) / (n + 1));
  return positions;
}

// Where lava exits: pumper tip or simple-hose nozzle, per selected style
function getHoseTipY(idx) {
  return cfg.hoseStyle === 'pumpers' ? getPumperTipY(idx) : hoseY + hoseLen;
}

// ─── Simple T-intersection hoses (original style) ─
function drawHosesSimple() {
  const positions = getHosePositions();
  for (let idx = 0; idx < positions.length; idx++) {
    const hx = positions[idx];
    const destroyed = destroyedHoses.has(idx);
    const justDestroyed = destroyed && Date.now() - destroyedHoses.get(idx) < 1000;
    const flash = justDestroyed && Math.sin(frame * 0.3) > 0;
    ctx.strokeStyle = flash ? '#f84' : destroyed ? '#ccc' : '#888';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(hx, hoseY);
    ctx.lineTo(hx, hoseY + hoseLen);
    ctx.stroke();
    // nozzle
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(hx - 6, hoseY + hoseLen);
    ctx.lineTo(hx + 6, hoseY + hoseLen);
    ctx.stroke();
  }
}

// ─── Lava ────────────────────────────────────────
const lavaParticles = [];
let gameOver = false;
let gameOverTime = 0;
let frame = 0;

// ─── Screen state ────────────────────────────────
let state = 'menu'; // 'menu' | 'playing'
let menuIndex = 0;
const games = [
  { name: 'Lava Runner', mode: 'classic' },
  { name: 'Ones to 9000', mode: 'ones' },
];
let gameMode = 'classic';

// ─── Bullets ─────────────────────────────────────
const bullets = [];
let lastShot = 0;
const SHOOT_DELAY = 200;

// Bullet colour cycling — press X (gamepad button 2) or X on the keyboard to
// switch all bullets through the enabled rainbow colours. Which colours are in
// the rotation is driven by the server config `cfg.bulletColors` (a comma-
// separated list of colour keys), editable live from the dev panel.
const COLOR_PALETTE = {
  black:  '#000000',
  red:    '#ff2d55', // red-pink
  orange: '#ff9500',
  yellow: '#ffd60a',
  green:  '#34c759',
  cyan:   '#00c7ff',
  blue:   '#0a84ff',
  purple: '#bf5af2',
  pink:   '#ff375f', // hot pink
};

let bulletColor = '#48f'; // default blue
// Active rotation — recomputed from cfg.bulletColors on each config poll.
function getActiveBulletColors() {
  const raw = String(cfg.bulletColors || '').trim();
  const list = raw
    .split(',')
    .map(s => s.trim().toLowerCase())
    .filter(k => COLOR_PALETTE[k] !== undefined);
  return list.length > 0 ? list : Object.keys(COLOR_PALETTE);
}
function cycleBulletColor() {
  const active = getActiveBulletColors();
  // Pick a new random colour from the enabled rotation, avoiding repeats.
  let currentKey = Object.keys(COLOR_PALETTE).find(k => COLOR_PALETTE[k] === bulletColor);
  let nextKey = currentKey;
  let tries = 0;
  while (nextKey === currentKey && tries < active.length * 2) {
    nextKey = active[Math.floor(Math.random() * active.length)];
    tries++;
  }
  bulletColor = COLOR_PALETTE[nextKey] !== undefined ? COLOR_PALETTE[nextKey] : bulletColor;
}

// ─── Power bar & splashes ────────────────────────
let POWER_TARGET = 10;
const CHARGE_MS = 4000;
const NO_SPAWN_MS = 3000;
const powerBar = {
  bricks: 0,
};
let barState = 'normal'; // 'normal' | 'charged' | 'charging'
let chargeStart = 0;
let collectedValues = [];
let barDisplay = 0; // eases toward powerBar.bricks each frame, for animated fill/drain
let missDisplayValues = null; // last busted combo, shown briefly in red
let missDisplayUntil = 0;
let superShot = null;
let noSpawnUntil = 0;
let destroyedHoses = new Map(); // idx -> Date.now() when destroyed
let won = false;
let winDelayUntil = 0; // timestamp after which the actual win screen kicks in
const splashes = [];

// ─── Screen flash & banner messages ──────────────
let flashColor = null, flashUntil = 0;
let bannerText = null, bannerColor = '#fff', bannerUntil = 0;
function triggerFlash(color, ms) { flashColor = color; flashUntil = Date.now() + ms; }
function showBanner(text, color, ms) { bannerText = text; bannerColor = color; bannerUntil = Date.now() + ms; }

// ─── Shared AudioContext (one for all sounds) ─────
let sharedAudioCtx = null;
function getAudioCtx() {
  if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const st = sharedAudioCtx.state;
  if (st === 'suspended' || st === 'interrupted') sharedAudioCtx.resume();
  return sharedAudioCtx;
}

// ─── Remote log shipping ─────────────────────────
// Every debug message is also queued and POSTed to /log (same origin
// through the tunnel); the server appends to infra/client.log, readable
// from the codespace with ./infra/logs.sh. sendBeacon still delivers
// while the page is blurred — exactly when the interesting events happen.
const LOG_SESSION = Math.random().toString(36).slice(2, 8);
const logQueue = ['page load: ' + navigator.userAgent];
function shipLog(msg) { logQueue.push(msg); }
function flushLogs() {
  if (!logQueue.length) return;
  const body = JSON.stringify({ session: LOG_SESSION, lines: logQueue.splice(0) });
  try {
    if (navigator.sendBeacon && navigator.sendBeacon('/log', body)) return;
  } catch (e) {}
  fetch('/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }).catch(() => {});
}
setInterval(flushLogs, 2000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushLogs(); });

// ─── Debug overlay ───────────────────────────────
const debugEl = document.getElementById('debug');
let debugMessages = [];
function showDebug(msg) {
  shipLog(msg);
  debugMessages.push(msg);
  if (debugMessages.length > 6) debugMessages.shift();
  debugEl.textContent = debugMessages.join('\n');
}
window.addEventListener('error', e => showDebug('ERR: ' + e.message));
window.addEventListener('unhandledrejection', e => showDebug('REJ: ' + (e.reason||'')));
function ts() { return new Date().toTimeString().slice(0, 8); }
window.addEventListener('gamepadconnected', e => showDebug(ts() + ' PAD: ' + e.gamepad.id + ' mapping=' + e.gamepad.mapping));
window.addEventListener('gamepaddisconnected', e => showDebug(ts() + ' PAD LOST: ' + e.gamepad.id));
document.addEventListener('visibilitychange', () => showDebug(ts() + ' visibility=' + document.visibilityState));
// Blame tracking: which controller buttons were down just before a blur.
// Standard mapping: 0=A 1=B 2=X 3=Y 4=L1 5=R1 6=L2 7=R2 8=select 9=start
// 10=L3 11=R3 12-15=dpad 16=home 17+=extras (Pro 3 paddles land here).
let lastPressed = { t: 0, ids: [] };
function trackPressedButtons() {
  const gp = getGamepad();
  if (!gp) return;
  const ids = [];
  for (let i = 0; i < gp.buttons.length; i++) if (btnPressed(gp.buttons[i])) ids.push(i);
  if (ids.length) lastPressed = { t: Date.now(), ids };
}
window.addEventListener('blur', () => {
  const age = Date.now() - lastPressed.t;
  const blame = lastPressed.ids.length && age < 1500
    ? ' after buttons [' + lastPressed.ids.join(',') + '] ' + (age < 120 ? 'just now' : (age / 1000).toFixed(1) + 's ago')
    : ' (no recent buttons)';
  showDebug(ts() + ' page BLUR' + blame);
});
window.addEventListener('focus', () => showDebug(ts() + ' page focus'));
// iOS gesture unlock: resume AudioContext on every gesture (persistent)
function reportError(e) { showDebug('ERR: ' + (e && e.message || e)); }
function unlockAudio() {
  try {
    // Must CREATE the context inside a gesture on iOS — gamepad buttons
    // don't count as gestures, so a controller-only player needs one tap.
    const c = getAudioCtx();
    const buf = c.createBuffer(1, 1, 22050);
    const src = c.createBufferSource();
    src.buffer = buf;
    src.connect(c.destination);
    src.start(0);
  } catch(e) {}
}
window.addEventListener('touchstart', unlockAudio);
window.addEventListener('mousedown', unlockAudio);
window.addEventListener('keydown', unlockAudio);

// ─── Web Audio: charge sound ─────────────────────
let chargeOsc = null, chargeGain = null;
function startChargeSound() {
  if (chargeOsc) return;
  try {
    const ac = getAudioCtx();
    chargeGain = ac.createGain();
    chargeGain.gain.setValueAtTime(0.08, ac.currentTime);
    chargeGain.gain.linearRampToValueAtTime(0.15, ac.currentTime + 4);
    chargeGain.connect(ac.destination);
    chargeOsc = ac.createOscillator();
    chargeOsc.type = 'sawtooth';
    chargeOsc.frequency.setValueAtTime(150, ac.currentTime);
    chargeOsc.frequency.linearRampToValueAtTime(900, ac.currentTime + 4);
    chargeOsc.connect(chargeGain);
    chargeOsc.start(ac.currentTime);
    chargeOsc.stop(ac.currentTime + 4.5);
    chargeOsc.onended = () => { chargeOsc = null; chargeGain = null; };
  } catch(e) {}
}
function stopChargeSound() {
  try { if (chargeOsc) { chargeOsc.stop(); chargeOsc = null; } } catch(e) {}
}

// ─── Web Audio: target hit / miss sounds ─────────
function playPositiveSound() {
  try {
    const ac = getAudioCtx();
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.2, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.45);
    gain.connect(ac.destination);
    const osc = ac.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523, ac.currentTime);
    osc.frequency.setValueAtTime(659, ac.currentTime + 0.1);
    osc.frequency.setValueAtTime(784, ac.currentTime + 0.2);
    osc.connect(gain);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + 0.5);
  } catch(e) {}
}
function playNegativeSound() {
  try {
    const ac = getAudioCtx();
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.2, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
    gain.connect(ac.destination);
    const osc = ac.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ac.currentTime + 0.4);
    osc.connect(gain);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + 0.45);
  } catch(e) {}
}

// ─── Input ───────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.code] = false);

// Parse the dev-panel allowed-targets list ("10" or "5,10,20") — null when unset
function getAllowedTargets() {
  const raw = String(cfg.allowedTargets || '').trim();
  if (!raw) return null;
  const nums = raw.split(/[,\s]+/).map(Number).filter(n => Number.isInteger(n) && n >= 2);
  if (nums.length === 0) return null;
  return [...new Set(nums)].sort((a, b) => a - b);
}

function randomPowerTarget() {
  if (gameMode === 'ones') {
    POWER_TARGET = randomOnesTarget(); // dev-panel target list doesn't apply here
    return;
  }
  const list = getAllowedTargets();
  if (list) {
    POWER_TARGET = list[Math.floor(Math.random() * list.length)];
  } else {
    POWER_TARGET = 3 + Math.floor(Math.random() * 18); // 3..20
  }
}

// ─── "Ones" mode: every blue number must contain a 1 ─
function hasOne(n) { return String(n).includes('1'); }

// Random d-digit number that contains a '1'
function randomOnesNumber(digits) {
  const lo = digits === 1 ? 1 : Math.pow(10, digits - 1);
  const hi = Math.pow(10, digits) - 1;
  for (;;) {
    const v = lo + Math.floor(Math.random() * (hi - lo + 1));
    if (hasOne(v)) return v;
  }
}

// Build the target as a sum of 3–5 numbers that all contain a '1', so every
// target is guaranteed reachable by a short, findable path (up to 9000).
function randomOnesTarget() {
  for (;;) {
    const k = 3 + Math.floor(Math.random() * 3); // 3..5 parts
    let sum = 0;
    for (let i = 0; i < k; i++) {
      const roll = Math.random();
      const digits = roll < 0.3 ? 1 : roll < 0.6 ? 2 : roll < 0.85 ? 3 : 4;
      sum += randomOnesNumber(digits);
    }
    if (sum >= 100 && sum <= 9000) return sum;
  }
}

// A good next number for the remaining amount R: completes the sum if it can,
// otherwise leaves a remainder that is itself easy to finish. Picks randomly
// among the best few candidates so help never feels scripted.
function bestOnesStep(R, allowComplete) {
  if (R < 1) return null;
  // Offer the exact finisher sometimes (always when the remainder is tiny) —
  // but never as the very first catch, so a target is never a one-blob win.
  if (allowComplete && hasOne(R) && (R < 20 || Math.random() < 0.6)) return R;
  // Otherwise take a healthy bite (≤60% of what's left) that leaves an
  // easy-to-finish remainder.
  const stepCap = Math.max(Math.ceil(R * 0.6), 19);
  let bestTier = -1;
  let best = [];
  for (let v = 1; v <= Math.min(R, stepCap); v++) {
    if (!hasOne(v)) continue;
    const rem = R - v;
    const tier = rem === 0 ? 3 : hasOne(rem) ? 2 : rem >= 11 ? 1 : 0;
    if (tier > bestTier) { bestTier = tier; best = [v]; }
    else if (tier === bestTier) best.push(v);
  }
  if (best.length === 0) return null;
  best.sort((a, b) => b - a); // prefer big steps toward big targets
  const top = best.slice(0, Math.min(5, best.length));
  return top[Math.floor(Math.random() * top.length)];
}

function pickOnesBlobValue() {
  const R = POWER_TARGET - powerBar.bricks;
  safeSpawnsSinceHelp++;
  const forceHelp = safeSpawnsSinceHelp >= Math.max(1, Math.round(cfg.pityEvery));
  // Most spawns steer the player: pity guarantees a good step every Nth blob,
  // and a little over half of the rest are good steps too.
  if (forceHelp || Math.random() < 0.55) {
    const v = bestOnesStep(R, powerBar.bricks > 0);
    if (v) {
      safeSpawnsSinceHelp = 0;
      return v;
    }
  }
  // The rest are random 1-containing numbers scaled to what's left — some
  // overshoot, and dodging those is part of the game.
  const maxDigits = Math.max(1, String(Math.max(R, 10)).length);
  const digits = 1 + Math.floor(Math.random() * maxDigits);
  let v = randomOnesNumber(digits);
  if (v > R && Math.random() < 0.6) v = bestOnesStep(R, powerBar.bricks > 0) || 1; // soften, like classic
  return v;
}

// ─── Random lava size helpers ────────────────────
function gaussianRandom(mean, std) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return mean + std * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// The pool of values a safe blob can carry for the current target
function valuePool() {
  if (gameMode === 'ones') {
    const out = [];
    for (let v = 1; v <= POWER_TARGET; v++) if (hasOne(v)) out.push(v);
    return out.length ? out : [1];
  }
  const n = Math.max(1, POWER_TARGET - 1);
  return Array.from({ length: n }, (_, i) => i + 1); // 1..target-1
}

let safeSpawnsSinceHelp = 0;

function pickBlobValue() {
  if (gameMode === 'ones') return pickOnesBlobValue();
  const pool = valuePool();
  const remaining = POWER_TARGET - powerBar.bricks;
  const inProgress = barState === 'normal' && powerBar.bricks > 0;

  // Pity rule: while a sum is in progress, at least every Nth safe blob
  // spawned is the exact number that completes it (when that number exists)
  if (inProgress) {
    safeSpawnsSinceHelp++;
    if (safeSpawnsSinceHelp >= Math.max(1, Math.round(cfg.pityEvery)) && pool.includes(remaining)) {
      safeSpawnsSinceHelp = 0;
      return remaining;
    }
  }

  // Flat-ish gaussian centred at target/2; on overflow, reroll 75% of the
  // time biased into the remaining range to soften frustration
  const mean = POWER_TARGET / 2;
  const std = mean * 0.7;
  let v = Math.round(gaussianRandom(mean, std));
  v = Math.max(1, Math.min(Math.max(1, POWER_TARGET - 1), v));
  if (inProgress && v > remaining && Math.random() < 0.75) {
    const u = Math.round(gaussianRandom(remaining / 2, Math.min(remaining / 2, std)));
    v = Math.max(1, Math.min(remaining, u));
  }
  if (inProgress && v === remaining) safeSpawnsSinceHelp = 0;
  return v;
}

// Map a value to a radius inside the safe (blue) zone: one size band per
// possible value, ordered so bigger numbers make bigger blobs. 90% of the
// band is used, leaving a visual gap between adjacent bands.
function mapValueToRadius(value) {
  if (gameMode === 'ones') {
    // One size band per digit count (1–4 digits): 1000s are huge, 1s tiny
    const digits = Math.min(4, String(value).length);
    const mn = cfg.lavaSizeMin;
    const bandSize = (cfg.lavaHarmSize - mn) / 4;
    return mn + (digits - 1) * bandSize + Math.random() * bandSize * 0.9;
  }
  const pool = valuePool();
  const idx = Math.max(0, pool.indexOf(value));
  const mn = cfg.lavaSizeMin;
  const bandSize = (cfg.lavaHarmSize - mn) / pool.length;
  return mn + idx * bandSize + Math.random() * bandSize * 0.9;
}

// ─── Spawn lava ──────────────────────────────────
function spawnLava() {
  const positions = getHosePositions();
  for (let idx = 0; idx < positions.length; idx++) {
    if (destroyedHoses.has(idx)) continue;
    const hx = positions[idx];
    let r, harmful, value = 0;
    // ~40% chance of a harmful red blob, rest are safe blue numbered blobs
    const harmChance = 0.4;
    if (Math.random() < harmChance) {
      harmful = true;
      r = cfg.lavaHarmSize + Math.random() * (cfg.lavaSizeMax - cfg.lavaHarmSize);
    } else {
      harmful = false;
      value = pickBlobValue();
      r = mapValueToRadius(value);
    }
    lavaParticles.push({
      x: hx + (Math.random() - 0.5) * 6,
      y: getHoseTipY(idx),
      vx: (Math.random() - 0.5) * 1.2,
      vy: cfg.lavaSpeed * (0.8 + Math.random() * 0.4),
      r: r,
      harmful,
      value,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

// ─── Splash effect (blue — for collecting safe blobs) ─
function createSplash(x, y) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3.5;
    splashes.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 2 + Math.random() * 4,
      color: '#48f',
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
    });
  }
}

// ─── Lava explosion (red/orange — for destroying harmful blobs) ─
function createLavaExplosion(x, y) {
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    splashes.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1, // slight upward bias
      r: 3 + Math.random() * 6,
      color: Math.random() < 0.5 ? '#f60' : '#f20', // orange / deep orange
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
    });
  }
}

// ─── Super shot zoom path ─────────────────────────
function buildZoomPath(sx, sy, targetIdx, redWaypoints = []) {
  const positions = getHosePositions();
  const pts = [{ x: sx, y: sy }];
  // Thread through each red blob position
  for (const wp of redWaypoints) {
    pts.push(wp);
  }
  // Add a couple of random bounce points for flair
  for (let i = 0; i < 2; i++) {
    pts.push({
      x: 40 + Math.random() * (W - 80),
      y: 60 + Math.random() * (H - 160),
    });
  }
  // End at the target pump
  pts.push({ x: positions[targetIdx], y: getHoseTipY(targetIdx) });
  return pts;
}
function pointOnPath(pts, t) {
  const segs = pts.length - 1;
  const segT = t * segs;
  const i = Math.min(Math.floor(segT), segs - 1);
  const localT = segT - i;
  const eased = localT * localT * (3 - 2 * localT);
  const a = pts[i], b = pts[i + 1];
  return { x: a.x + (b.x - a.x) * eased, y: a.y + (b.y - a.y) * eased };
}
function checkWinCondition() {
  if (destroyedHoses.size >= getHosePositions().length && !gameOver) {
    won = true;
    winDelayUntil = Date.now() + 2500; // 2.5 s to watch the last pump stop
  }
}

// ─── Gamepad helpers ─────────────────────────────
function getGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) if (p) return p;
  return null;
}
function btnPressed(btn) { return btn && (btn.pressed || btn.value > 0.5); }

// ─── Gamepad watchdog: diagnose mid-game input dropouts ─
// Once a second, log transitions in pad presence and input freshness.
// gp.timestamp only advances when Safari receives new HID state, so a
// frozen timestamp WHILE you are pressing buttons means Safari stopped
// delivering input even though the pad is still enumerated.
let wdLast = 0, wdHadPad = null, wdPadTs = -1, wdStalled = false, wdId = '';
function gamepadWatchdog() {
  const now = Date.now();
  if (now - wdLast < 1000) return;
  wdLast = now;
  const gp = getGamepad();
  if (!!gp !== wdHadPad) {
    showDebug(ts() + (gp
      ? ' pad present idx=' + gp.index + ' [' + (gp.id || '?').slice(0, 24) + ']'
      : ' PAD GONE from getGamepads()') + ' focus=' + document.hasFocus());
    wdHadPad = !!gp;
    wdStalled = false;
    wdPadTs = gp ? gp.timestamp : -1;
    wdId = gp ? gp.id : '';
    return;
  }
  if (!gp) return;
  if (gp.id !== wdId) { // same slot, different device = mode/profile switch
    showDebug(ts() + ' PAD CHANGED ID: ' + (gp.id || '?').slice(0, 30));
    wdId = gp.id;
  }
  const stalled = gp.timestamp === wdPadTs;
  if (stalled !== wdStalled) {
    showDebug(ts() + (stalled
      ? ' PAD STALLED (listed but timestamp frozen)'
      : ' pad resumed') + ' focus=' + document.hasFocus());
    wdStalled = stalled;
  }
  wdPadTs = gp.timestamp;
}

const BTN_A = 0, BTN_B = 1, BTN_X = 2, DPAD_LEFT = 14, DPAD_RIGHT = 15;
let prevGpButtons = [];
function gpEdge(index) {
  const gp = getGamepad();
  if (!gp) return false;
  return btnPressed(gp.buttons[index]) && !prevGpButtons[index];
}

// ─── Update ──────────────────────────────────────
function update() {
  frame++;

  // Win delay — once the last pump is destroyed, wait a beat then show the screen
  if (won && !gameOver && Date.now() >= winDelayUntil) {
    gameOver = true;
    gameOverTime = Date.now();
    shipLog('=== game over (won) ===');
  }

  const gp = getGamepad();

  // Ship movement (always points up)
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) dx = -1;
  if (keys['ArrowRight'] || keys['KeyD']) dx = 1;
  if (keys['ArrowUp'] || keys['KeyW']) dy = -1;
  if (keys['ArrowDown'] || keys['KeyS']) dy = 1;

  if (gp) {
    const lx = gp.axes[0], ly = gp.axes[1];
    if (Math.abs(lx) > 0.15) dx = lx;
    if (Math.abs(ly) > 0.15) dy = ly;
    if (btnPressed(gp.buttons[12])) dy = -1;
    if (btnPressed(gp.buttons[13])) dy = 1;
    if (btnPressed(gp.buttons[14])) dx = -1;
    if (btnPressed(gp.buttons[15])) dx = 1;
  }

  // Normalise diagonal
  const mag = Math.hypot(dx, dy);
  if (mag > 1) { dx /= mag; dy /= mag; }

  ship.x += dx * ship.speed;
  ship.y += dy * ship.speed;
  ship.x = Math.max(ship.w / 2, Math.min(W - ship.w / 2, ship.x));
  ship.y = Math.max(ship.h / 2, Math.min(H - ship.h / 2, ship.y));

  // Shooting
  const triggerDown = gp && (btnPressed(gp.buttons[0]) || btnPressed(gp.buttons[7]));
  const normalShooting = (keys['Space']) || triggerDown;
  const superShooting = (keys['KeyZ']) ||
    (gp && btnPressed(gp.buttons[7]));

  // Charge super shot when bar is charged and ship is near bottom
  if (barState === 'charged' && superShooting && ship.y > H * 0.65) {
    barState = 'charging';
    chargeStart = Date.now();
    startChargeSound();
  }
  if (barState === 'charging') {
    if (!superShooting || ship.y <= H * 0.65) {
      barState = 'charged';
      stopChargeSound();
    } else if (Date.now() - chargeStart >= CHARGE_MS) {
      // Fire super shot! Weave through every red blob on screen, then hit a pump.
      stopChargeSound();
      barState = 'normal';
      powerBar.bricks = 0;
      collectedValues.length = 0;
      const positions = getHosePositions();
      const remainingHoses = positions.map((_, i) => i).filter(i => !destroyedHoses.has(i));
      if (remainingHoses.length > 0) {
        const targetIdx = remainingHoses[Math.floor(Math.random() * remainingHoses.length)];
        // Gather red blob positions along the way
        const redWaypoints = lavaParticles
          .filter(l => l.harmful)
          .map(l => ({ x: l.x, y: l.y }));
        const startX = ship.x, startY = ship.y - ship.h / 2;
        superShot = {
          x: startX, y: startY,
          startTime: Date.now(), duration: Math.max(1200, 800 + redWaypoints.length * 200),
          waypoints: buildZoomPath(startX, startY, targetIdx, redWaypoints),
          targetIdx, r: 28, trail: [],
          redBlobsToDestroy: new Set(lavaParticles.filter(l => l.harmful)),
        };
      }
    }
  }

  // Normal shooting when not charging
  if (normalShooting && !gameOver && barState !== 'charging') {
    if (Date.now() - lastShot > cfg.shootDelay) {
      lastShot = Date.now();
      bullets.push({
        x: ship.x,
        y: ship.y - ship.h / 2,
        vy: -cfg.bulletSpeed,
        color: bulletColor,
      });
    }
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y += b.vy;
    if (b.y < 0) { bullets.splice(i, 1); continue; }
    // Check vs lava
    for (let j = lavaParticles.length - 1; j >= 0; j--) {
      const l = lavaParticles[j];
      const d = Math.hypot(b.x - l.x, b.y - l.y);
      if (d < l.r + 3) {
        bullets.splice(i, 1);
        lavaParticles.splice(j, 1);
        break;
      }
    }
  }

  // Super shot — zooms around the screen, pierces anything, then nails its target hose
  if (superShot) {
    const elapsed = Date.now() - superShot.startTime;
    const t = Math.min(elapsed / superShot.duration, 1);
    const pos = pointOnPath(superShot.waypoints, t);
    superShot.x = pos.x;
    superShot.y = pos.y;
    superShot.trail.push({ x: pos.x, y: pos.y });
    if (superShot.trail.length > 18) superShot.trail.shift();

    // Destroy red blobs (both ones in the path set and any new ones the shot passes through)
    for (let j = lavaParticles.length - 1; j >= 0; j--) {
      const l = lavaParticles[j];
      if (!l.harmful) continue;
      if (Math.hypot(superShot.x - l.x, superShot.y - l.y) < l.r + superShot.r) {
        createLavaExplosion(l.x, l.y);
        lavaParticles.splice(j, 1);
        noSpawnUntil = Date.now() + NO_SPAWN_MS;
      }
    }

    if (t >= 1) {
      const positions = getHosePositions();
      destroyedHoses.set(superShot.targetIdx, Date.now());
      if (pumpers[superShot.targetIdx]) pumpers[superShot.targetIdx].destroyed = true;
      createSplash(positions[superShot.targetIdx], getHoseTipY(superShot.targetIdx) - 10);
      noSpawnUntil = Date.now() + NO_SPAWN_MS;
      const remaining = positions.length - destroyedHoses.size;
      showBanner('Oil Pump destroyed! ' + remaining + ' Left!', '#fc4', 1800);
      triggerFlash('rgba(255,180,60,0.3)', 250);
      superShot = null;
      checkWinCondition();
    }
  }

  // Lava
  for (let i = lavaParticles.length - 1; i >= 0; i--) {
    const l = lavaParticles[i];
    l.x += l.vx;
    l.y += l.vy;
    l.vy += cfg.lavaGravity;
    l.phase += 0.1;

    // Remove if off screen
    if (l.y > H + 20 || l.x < -20 || l.x > W + 20) {
      lavaParticles.splice(i, 1);
      continue;
    }
    // Collision with ship
    if (!gameOver) {
      const d = Math.hypot(l.x - ship.x, l.y - ship.y);
      if (d < l.r + ship.w / 2.5) {
        if (l.harmful) {
          gameOver = true;
          gameOverTime = Date.now();
          shipLog('=== game over (lost) ===');
        } else {
          // Collect blue lava
          createSplash(l.x, l.y);
          lavaParticles.splice(i, 1);
          safeSpawnsSinceHelp = 0; // sum changed — restart the pity count
          if (barState === 'normal') {
            const val = l.value || 1;
            const newSum = powerBar.bricks + val;
            if (newSum === POWER_TARGET) {
              powerBar.bricks = POWER_TARGET;
              collectedValues.push(val);
              barState = 'charged';
              triggerFlash('rgba(80,255,140,0.35)', 250);
              showBanner('Target hit! Power ready!', '#4f8', 1600);
              playPositiveSound();
            } else if (newSum > POWER_TARGET) {
              missDisplayValues = [...collectedValues, val];
              missDisplayUntil = Date.now() + 1600;
              powerBar.bricks = 0;
              collectedValues.length = 0;
              triggerFlash('rgba(255,70,70,0.35)', 250);
              showBanner('Target missed - power bar reset', '#f66', 1600);
              playNegativeSound();
            } else {
              powerBar.bricks = newSum;
              collectedValues.push(val);
            }
          }
        }
      }
    }
  }

  updatePumpers();
  // Spawn new lava occasionally
  if (!gameOver && frame % cfg.lavaSpawnRate === 0 && Date.now() > noSpawnUntil) spawnLava();

  // Ease the displayed bar fill toward the real value (drives the animated drain on a bust)
  barDisplay += (powerBar.bricks - barDisplay) * 0.15;

  // Splashes
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.05;
    s.life -= s.decay;
    if (s.life <= 0) splashes.splice(i, 1);
  }
}

// ─── Draw ship (always pointing up) ──────────────
function drawShip() {
  const { x, y, w, h } = ship;
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -h / 2);         // nose
  ctx.lineTo(-w / 2, h / 2);     // bottom-left
  ctx.lineTo(0, h / 2 - 6);      // notch
  ctx.lineTo(w / 2, h / 2);      // bottom-right
  ctx.closePath();
  ctx.stroke();
  // thrust glow
  if (keys['ArrowUp'] || keys['KeyW']) {
    ctx.strokeStyle = '#f84';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-6, h / 2 - 4);
    ctx.lineTo(0, h / 2 + 8 + Math.random() * 6);
    ctx.lineTo(6, h / 2 - 4);
    ctx.stroke();
  }
  ctx.restore();
}

// ─── Draw hoses ──────────────────────────────────
// ─── Draw lava ───────────────────────────────────
function drawLava() {
  for (const l of lavaParticles) {
    const r = l.r + Math.sin(l.phase) * 0.8;
    // Glow effect
    const glow = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, r * 2.5);
    if (l.harmful) {
      glow.addColorStop(0, `rgba(255, ${120 + 80 * Math.sin(l.phase)}, 0, 0.8)`);
      glow.addColorStop(0.4, `rgba(255, ${80 + 60 * Math.sin(l.phase + 1)}, 0, 0.5)`);
      glow.addColorStop(1, 'rgba(255, 0, 0, 0)');
    } else {
      glow.addColorStop(0, `rgba(100, ${180 + 60 * Math.sin(l.phase)}, 255, 0.8)`);
      glow.addColorStop(0.4, `rgba(50, ${120 + 60 * Math.sin(l.phase + 1)}, 220, 0.5)`);
      glow.addColorStop(1, 'rgba(0, 50, 255, 0)');
    }
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(l.x, l.y, r * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Core
    if (l.harmful) {
      ctx.fillStyle = `rgb(255, ${160 + 80 * Math.sin(l.phase)}, 20)`;
      ctx.beginPath();
      ctx.arc(l.x, l.y, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = `rgb(100, ${180 + 60 * Math.sin(l.phase)}, 255)`;
      ctx.beginPath();
      ctx.arc(l.x, l.y, r, 0, Math.PI * 2);
      ctx.fill();
      // Number on blue blob — as big as practicable while still fitting
      if (r > 5) {
        // Shrink to fit multi-digit numbers inside the blob
        const len = String(l.value || '?').length;
        const fontSize = Math.max(9, Math.min(r * 1.6, r * 3.1 / len));
        ctx.font = `bold ${fontSize}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = 'rgba(0,40,120,0.9)';
        ctx.lineWidth = Math.max(2, fontSize * 0.12);
        ctx.strokeText(l.value || '?', l.x, l.y);
        ctx.fillStyle = '#fff';
        ctx.fillText(l.value || '?', l.x, l.y);
        ctx.textBaseline = 'alphabetic';
      }
    }
  }
}

// ─── Draw game over ──────────────────────────────
function drawGameOver() {
  const elapsed = (Date.now() - gameOverTime) / 1000;
  const remaining = Math.ceil(cfg.restartDelay - elapsed);
  const restartReady = elapsed >= cfg.restartDelay;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = won ? '#4f8' : '#f44';
  ctx.font = 'bold 52px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(won ? 'YOU WIN!!' : 'GAME OVER', W / 2, H / 2 - 80);

  if (restartReady) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px monospace';
    ctx.fillText('A: Restart    B: Menu', W / 2, H / 2 + 20);
  } else {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 72px monospace';
    ctx.fillText(remaining, W / 2, H / 2 - 10);
    ctx.fillStyle = '#999';
    ctx.font = '20px monospace';
    ctx.fillText('seconds until ready', W / 2, H / 2 + 30);
  }
}

// ─── Draw menu ───────────────────────────────────
function drawMenu() {
  ctx.fillStyle = '#000';
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SELECT GAME', W / 2, H / 3 - 60);

  const boxW = 160, boxH = 120, gap = 20;
  const total = games.length * boxW + (games.length - 1) * gap;
  const startX = (W - total) / 2;

  games.forEach((g, i) => {
    const x = startX + i * (boxW + gap);
    const selected = i === menuIndex;
    ctx.fillStyle = selected ? '#fde' : '#fff';
    ctx.fillRect(x, y, boxW, boxH);
    ctx.strokeStyle = selected ? '#f84' : '#000';
    ctx.lineWidth = selected ? 4 : 2;
    ctx.strokeRect(x, y, boxW, boxH);
    ctx.fillStyle = '#000';
    ctx.font = '16px monospace';
    ctx.fillText(g.name, x + boxW / 2, y + boxH / 2 + 6);
  });

  ctx.fillStyle = '#555';
  ctx.font = '14px monospace';
  ctx.fillText('◄/► choose   A: play', W / 2, y + boxH + 50);

  if (!sharedAudioCtx || sharedAudioCtx.state !== 'running') {
    ctx.fillStyle = '#f84';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('tap anywhere once to enable sound', W / 2, y + boxH + 84);
  }

  // Pad debug
  const pad = getGamepad();
  if (pad) {
    const ids = [];
    for (let i = 0; i < pad.buttons.length; i++) {
      if (btnPressed(pad.buttons[i])) ids.push(i);
    }
    ctx.fillStyle = '#888';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    const info = 'pad=' + (pad.id || '?').slice(0, 20) + ' pressed=[' + ids.join(',') + ']';
    ctx.fillText(info, 8, H - 6);
    ctx.textAlign = 'center';
  }
}

function moveMenu(delta) {
  menuIndex = ((menuIndex + delta) % games.length + games.length) % games.length;
}

function launchGame(i) {
  gameMode = games[i].mode || 'classic';
  resetGame();
  state = 'playing';
  shipLog('=== game start (' + gameMode + ') ===');
}

function backToMenu() {
  resetGame();
  state = 'menu';
  shipLog('=== back to menu ===');
}

// ─── Draw bullets ────────────────────────────────
function drawBullets() {
  for (const b of bullets) {
    ctx.fillStyle = b.color || bulletColor;
    ctx.fillRect(b.x - 2, b.y - 5, 4, 10);
  }
}

// ─── Draw splashes ───────────────────────────────
function drawSplashes() {
  for (const s of splashes) {
    ctx.globalAlpha = s.life;
    ctx.fillStyle = s.color || '#48f';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── Draw power bar (dispatches to the selected layout) ─
function drawPowerBar() {
  // Side layout draws one brick per unit — unusable with 4-digit targets
  if (cfg.uiLayout === 'side' && gameMode !== 'ones') drawPowerBarSide();
  else drawPowerBarBottom();
}

// ─── Equation text shared by the bottom layout ───
function getEquationDisplay() {
  if (barState === 'charged' || barState === 'charging') {
    return { text: collectedValues.join(' + ') + ' = ' + POWER_TARGET, color: '#4f8' };
  }
  if (missDisplayValues && Date.now() < missDisplayUntil) {
    return { text: missDisplayValues.join(' + ') + ' ≠ ' + POWER_TARGET, color: '#f66' };
  }
  if (collectedValues.length > 0) {
    return { text: collectedValues.join(' + ') + ' + ? ≠ ' + POWER_TARGET, color: '#8cf' };
  }
  return { text: '? ≠ ' + POWER_TARGET, color: '#8cf' };
}

// ─── Bottom-centered layout (default) ────────────
function drawPowerBarBottom() {
  const barW = Math.min(340, W - 40), barH = 26;
  const bx = W / 2 - barW / 2;
  const by = H - 66;

  if (barState === 'charging') {
    const elapsed = Date.now() - chargeStart;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    const dots = '.'.repeat(Math.floor((elapsed / 500) % 4));
    ctx.fillText('SHOOP' + dots, W / 2, by - 46);
  }

  const eq = getEquationDisplay();
  ctx.fillStyle = eq.color;
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(eq.text, W / 2, by - 14);

  // Bar background
  ctx.fillStyle = '#ddd';
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 1;
  ctx.fillRect(bx, by, barW, barH);
  ctx.strokeRect(bx, by, barW, barH);

  if (barState === 'charged' || barState === 'charging') {
    const grad = ctx.createLinearGradient(bx, by, bx + barW, by);
    grad.addColorStop(0, '#48f');
    grad.addColorStop(0.3, '#8cf');
    grad.addColorStop(0.6, '#48f');
    grad.addColorStop(1, '#8cf');
    ctx.fillStyle = grad;
    ctx.fillRect(bx, by, barW, barH);
    ctx.strokeStyle = '#37d';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, barW, barH);
    if (barState === 'charging') {
      const elapsed = Date.now() - chargeStart;
      const pct = Math.min(elapsed / CHARGE_MS, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(bx, by, barW * pct, barH);
    }
  } else {
    const pct = Math.max(0, Math.min(barDisplay / POWER_TARGET, 1));
    ctx.fillStyle = '#48f';
    ctx.fillRect(bx, by, barW * pct, barH);
    ctx.strokeStyle = '#37d';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, barW * pct, barH);
  }
}

// ─── Side vertical layout (legacy, selectable in dev panel) ─
function drawPowerBarSide() {
  const brickW = 50, brickH = 20, gap = 3;
  const x = 12;
  const barBase = H - 96; // "by" of the bottom-most brick — shifted up to leave room below for the sum + instructions
  const barTop = barBase - (POWER_TARGET - 1) * (brickH + gap);
  const barBottomEdge = barBase + brickH;

  // Target label + big number, stacked above the bar
  ctx.fillStyle = '#888';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('TARGET', x, barTop - 46);

  ctx.fillStyle = '#f84';
  ctx.font = 'bold 40px monospace';
  ctx.fillText(String(POWER_TARGET), x, barTop - 12);

  if (barState === 'charged' || barState === 'charging') {
    // Shining gradient bar
    const barH = POWER_TARGET * (brickH + gap) - gap;
    const grad = ctx.createLinearGradient(x, barTop, x + brickW, barTop);
    grad.addColorStop(0, '#48f');
    grad.addColorStop(0.3, '#8cf');
    grad.addColorStop(0.6, '#48f');
    grad.addColorStop(1, '#8cf');
    ctx.fillStyle = grad;
    ctx.fillRect(x, barTop, brickW, barH);
    ctx.strokeStyle = '#37d';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, barTop, brickW, barH);

    if (barState === 'charging') {
      // Draw charging progress
      const elapsed = Date.now() - chargeStart;
      const pct = Math.min(elapsed / CHARGE_MS, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(x, barTop + barH * (1 - pct), brickW, barH * pct);
      // ShooOOOOP text
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      const dots = '.'.repeat(Math.floor((elapsed / 500) % 4));
      ctx.fillText('SHOOP' + dots, x + brickW / 2, barTop - 8);
      ctx.textAlign = 'left';
    }
  } else {
    // Normal bricks
    for (let i = 0; i < POWER_TARGET; i++) {
      const by = barBase - i * (brickH + gap);
      if (i < powerBar.bricks) {
        ctx.fillStyle = '#48f';
        ctx.strokeStyle = '#37d';
      } else {
        ctx.fillStyle = '#ddd';
        ctx.strokeStyle = '#bbb';
      }
      ctx.lineWidth = 1;
      ctx.fillRect(x, by, brickW, brickH);
      ctx.strokeRect(x, by, brickW, brickH);
    }
  }

  // Running sum, e.g. "3 + 4", below the bar
  if (collectedValues.length > 0) {
    ctx.fillStyle = '#8cf';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(collectedValues.join(' + '), x, barBottomEdge + 22);
  }
}

// ─── Draw super shot: big, glowing, with a zoom trail ─
function drawSuperShot() {
  if (!superShot) return;
  for (let i = 0; i < superShot.trail.length; i++) {
    const p = superShot.trail[i];
    const alpha = (i + 1) / superShot.trail.length;
    ctx.globalAlpha = alpha * 0.5;
    ctx.fillStyle = '#8cf';
    ctx.beginPath();
    ctx.arc(p.x, p.y, superShot.r * 0.6 * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const glow = ctx.createRadialGradient(superShot.x, superShot.y, 0, superShot.x, superShot.y, superShot.r * 3);
  glow.addColorStop(0, 'rgba(140,200,255,0.9)');
  glow.addColorStop(0.5, 'rgba(80,140,255,0.4)');
  glow.addColorStop(1, 'rgba(80,140,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(superShot.x, superShot.y, superShot.r * 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#8cf';
  ctx.shadowColor = '#8cf';
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.arc(superShot.x, superShot.y, superShot.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(superShot.x - superShot.r * 0.3, superShot.y - superShot.r * 0.3, superShot.r * 0.35, 0, Math.PI * 2);
  ctx.fill();
}

// ─── Draw break countdown (after a pump is destroyed) ─
function drawBreakCountdown() {
  if (gameOver || won || superShot) return;
  if (destroyedHoses.size === 0) return;
  const remaining = noSpawnUntil - Date.now();
  if (remaining <= 0) return;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#4f8';
  ctx.font = 'bold 30px monospace';
  ctx.fillText('Good work! Take a break.', W / 2, H / 2 - 30);
  ctx.font = 'bold 56px monospace';
  ctx.fillText(Math.ceil(remaining / 1000), W / 2, H / 2 + 34);
  ctx.textAlign = 'left';
}

// ─── Draw screen flash + banner messages ─────────
function drawFlashAndBanner() {
  if (Date.now() < flashUntil) {
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
  }
  if (bannerText) {
    if (Date.now() < bannerUntil) {
      ctx.fillStyle = bannerColor;
      ctx.font = 'bold 32px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(bannerText, W / 2, H * 0.3);
    } else {
      bannerText = null;
    }
  }
}

// ─── Draw UI ─────────────────────────────────────
function drawUI() {
  drawPowerBar();
  ctx.fillStyle = '#555';
  ctx.font = '14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('Arrows/WASD move  |  Space/Z shoot  |  Gamepad supported', 12, H - 12);
  // Audio-locked hint (sound effects need one tap on iOS)
  if (!sharedAudioCtx || sharedAudioCtx.state !== 'running') {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f84';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('🔇 TAP SCREEN ONCE FOR SOUND', W - 12, H - 12);
    ctx.textAlign = 'left';
  }
}

// ─── Main loop ───────────────────────────────────
function draw() {
  if (cfg.hoseStyle === 'pumpers') drawPumpers();
  else drawHosesSimple();
  drawLava();
  drawSplashes();
  drawSuperShot();
  drawBullets();
  drawShip();
  drawUI();
  drawBreakCountdown();
  drawFlashAndBanner();

  if (gameOver) drawGameOver();
}

// ─── Focus pause ─────────────────────────────────
// Safari freezes Gamepad API delivery whenever the page loses focus
// (controller home/share button, notification banner, screenshot UI).
// Pause instead of leaving the ship uncontrollable; a tap refocuses
// the page, which restarts gamepad delivery.
// Both conditions are debounced: some controller buttons (e.g. R1) can
// blur the page or de-list the pad for just a frame or two, and reacting
// instantly makes the overlays strobe. Blips are counted and logged to
// the debug overlay instead so we can see which signal is flickering.
let focusPaused = false, unfocusedSince = 0, focusBlips = 0, lastBlipLog = 0;
function logBlips(label, n) {
  if (Date.now() - lastBlipLog < 2000) return false;
  showDebug(ts() + ' ' + label + ' blipped x' + n);
  lastBlipLog = Date.now();
  return true;
}
function updateFocusPause() {
  if (document.hasFocus()) {
    if (unfocusedSince && !focusPaused) {
      focusBlips++;
      if (logBlips('focus', focusBlips)) focusBlips = 0;
    }
    unfocusedSince = 0;
    if (focusPaused) {
      focusPaused = false;
      showDebug(ts() + ' resumed: focus back');
    }
    return;
  }
  if (!unfocusedSince) unfocusedSince = Date.now();
  if (!focusPaused && state !== 'menu' && !gameOver && Date.now() - unfocusedSince > 700) {
    focusPaused = true;
    showDebug(ts() + ' paused: page lost focus');
  }
}
function drawFocusPause() {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c33';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('PAUSED — controller input interrupted', W / 2, H / 2 - 14);
  ctx.fillStyle = '#333';
  ctx.font = '16px monospace';
  ctx.fillText('usually resumes by itself — tap the screen if it does not', W / 2, H / 2 + 18);
}

// Safari can drop the pad from getGamepads() entirely after focus loss
// and only re-lists it once a controller button is pressed — tapping
// the screen refocuses the page but is not enough on its own.
let padSeen = false, padMissingSince = 0, padBlips = 0;
function drawPadReconnectHint() {
  if (getGamepad()) {
    padSeen = true;
    if (padMissingSince) {
      padBlips++;
      if (logBlips('pad', padBlips)) padBlips = 0;
    }
    padMissingSince = 0;
    return;
  }
  if (!padSeen) return;
  if (!padMissingSince) padMissingSince = Date.now();
  if (Date.now() - padMissingSince < 400) return;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillRect(W / 2 - 240, 8, 480, 30);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c33';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('controller lost — press any button on it to reconnect', W / 2, 28);
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  updateFocusPause();
  if (state === 'menu') {
    drawMenu();
  } else {
    if (!gameOver && !focusPaused) update();
    draw();
    if (focusPaused) drawFocusPause();
  }
  if (!focusPaused) drawPadReconnectHint();
  trackPressedButtons();
  gamepadWatchdog();
  if (!focusPaused) handleGamepadInput();
  requestAnimationFrame(loop);
}

// ─── Restart ─────────────────────────────────────
function resetGame() {
  gameOver = false;
  won = false;
  winDelayUntil = 0;
  lavaParticles.length = 0;
  bullets.length = 0;
  splashes.length = 0;
  powerBar.bricks = 0;
  collectedValues.length = 0;
  barDisplay = 0;
  missDisplayValues = null;
  barState = 'normal';
  chargeStart = 0;
  superShot = null;
  noSpawnUntil = 0;
  safeSpawnsSinceHelp = 0;
  destroyedHoses.clear();
  randomPowerTarget();
  initPumpers();
  flashUntil = 0;
  bannerText = null;
  stopChargeSound();
  ship.x = W / 2;
  ship.y = H - 60;
}
function doRestart() { resetGame(); }
function canRestart() { return gameOver && (Date.now() - gameOverTime) / 1000 >= cfg.restartDelay; }

// ─── Keyboard: menu / game-over actions (one-shot) ─
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const isA = e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyZ';
  const isB = e.code === 'Escape' || e.code === 'Backspace' || e.code === 'KeyX';

  if (state === 'menu') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveMenu(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') moveMenu(1);
    if (isA) launchGame(menuIndex);
  } else if (state === 'playing') {
    // Press X to cycle bullet colour through strong rainbow colours.
    if (e.code === 'KeyX') cycleBulletColor();
  } else if (gameOver) {
    if (isA && canRestart()) doRestart();
    if (isB && canRestart()) backToMenu();
  }
});

// ─── Gamepad: menu / game-over actions (edge-triggered) ─
function handleGamepadInput() {
  try {
    const gp = getGamepad();
    if (gp) {
      if (state === 'menu') {
        if (gpEdge(DPAD_LEFT)) moveMenu(-1);
        if (gpEdge(DPAD_RIGHT)) moveMenu(1);
        if (gpEdge(BTN_A)) launchGame(menuIndex);
      } else if (state === 'playing') {
        // Press X to cycle bullet colour through strong rainbow colours.
        if (gpEdge(BTN_X)) cycleBulletColor();
      } else if (gameOver) {
        if (gpEdge(BTN_A) && canRestart()) doRestart();
        if (gpEdge(BTN_B) && canRestart()) backToMenu();
      }
    }
    prevGpButtons = gp ? gp.buttons.map(b => btnPressed(b)) : [];
  } catch (e) { reportError(e); }
}

requestAnimationFrame(loop);
</script>
</body>
</html>
